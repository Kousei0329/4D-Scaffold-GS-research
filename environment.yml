name: 4d_scaffold
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults
dependencies:
  - cudatoolkit=11.6
  - plyfile=0.8.1
  - python=3.7.13
  - pip=22.3.1
  - pytorch=1.12.1
  - torchaudio=0.12.1
  - torchvision=0.13.1
  - pytorch-scatter
  - tqdm
  # pinned to defaults channel: conda-forge's libtiff (.so.6) breaks this pillow build (.so.5), and
  # conda-forge has no py3.7 pillow=9.4.0 build to fall back to
  - defaults::pillow=9.4.0
  - defaults::libtiff=4.2.0
  - pip:
    - einops
    - natsort
    - wandb
    - lpips
    - laspy
    - opencv-python
    - jaxtyping
    - imagesize
    - submodules/diff-gaussian-rasterization
    - submodules/simple-knn
